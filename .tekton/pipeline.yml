apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: flask-capstone
spec:
  params:
    - name: repo-url
      type: string
    - name: branch
      type: string
      default: main
    - name: build-image
      type: string
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: git-clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: pipeline-workspace
    - name: flake8
      runAfter:
        - git-clone
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: nose
      runAfter:
        - flake8
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: buildah
      runAfter:
        - nose
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: .
        - name: TLSVERIFY
          value: "true"
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: deploy
      runAfter:
        - buildah
      taskRef:
        name: openshift-client
      params:
        - name: SCRIPT
          value: |
            oc create deployment flask-capstone --image=$(params.build-image) --dry-run=client -o yaml | oc apply -f -
            oc expose deployment/flask-capstone --port=8000 --target-port=8000 --name=flask-capstone --dry-run=client -o yaml | oc apply -f -
            oc rollout status deployment/flask-capstone --timeout=180s
